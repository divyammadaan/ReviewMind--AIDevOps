# ReviewMind AIDevOps: a containerised shop made of microservices that can be
# broken and repaired from the control plane.
#
#   docker compose up --build        then open  http://localhost:9000  (control plane)
#                                               http://localhost:8080  (storefront)
#   podman compose up --build        works the same way (see README, "Running on Podman")
#
# Secrets come from ../.env (gitignored; copy ../.env.example first). Services restart from the shared
# `runtime` volume, so breaking or fixing one is just rewriting its main.py. `watchfiles` restarts the
# service on every change and escalates to SIGKILL, so a patch that ignores signals cannot wedge a rollback.
# Only the `metrics` sidecar mounts the container engine's socket (to read CPU/memory stats).
# Every service has a `-canary` twin: an approved patch can be tried on a share of traffic first.

# OpenTelemetry: /otel/sitecustomize.py instruments FastAPI and httpx in every process. Spans, metrics and
# logs go to the control plane's OTLP receiver. Telemetry is optional: if the receiver is down the services
# run unchanged.
x-otel: &otel
  PYTHONPATH: /otel
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://ops:9000/v1/traces
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://ops:9000/v1/metrics
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://ops:9000/v1/logs
  OTEL_EXPORTER_OTLP_TIMEOUT: "2"

x-service: &service
  build: .
  image: reviewmind/aidevops:latest
  volumes: [runtime:/runtime]
  restart: unless-stopped
  command: ["sh", "/serve.sh"]

services:
  gateway:
    <<: *service
    container_name: aidevops-gateway
    ports: ["8080:8080"]
    environment: {<<: *otel, OTEL_SERVICE_NAME: gateway}
    command: ["uvicorn", "main:app", "--app-dir", "/golden/gateway", "--host", "0.0.0.0", "--port", "8080"]

  catalog:
    <<: *service
    container_name: aidevops-catalog
    environment: {<<: *otel, OTEL_SERVICE_NAME: catalog, SVC: catalog, PORT: "9101"}

  inventory:
    <<: *service
    container_name: aidevops-inventory
    environment: {<<: *otel, OTEL_SERVICE_NAME: inventory, SVC: inventory, PORT: "9102"}

  cart:
    <<: *service
    container_name: aidevops-cart
    environment: {<<: *otel, OTEL_SERVICE_NAME: cart, SVC: cart, PORT: "9103"}

  payments:
    <<: *service
    container_name: aidevops-payments
    environment: {<<: *otel, OTEL_SERVICE_NAME: payments, SVC: payments, PORT: "9104"}

  orders:
    <<: *service
    container_name: aidevops-orders
    environment: {<<: *otel, OTEL_SERVICE_NAME: orders, SVC: orders, PORT: "9105"}

  # ---- canary twins: same code, separate containers; the gateway sends them a share of traffic ----
  catalog-canary:
    <<: *service
    container_name: aidevops-catalog-canary
    environment: {<<: *otel, OTEL_SERVICE_NAME: catalog-canary, SVC: catalog-canary, SRC: catalog, PORT: "9101"}

  inventory-canary:
    <<: *service
    container_name: aidevops-inventory-canary
    environment: {<<: *otel, OTEL_SERVICE_NAME: inventory-canary, SVC: inventory-canary, SRC: inventory, PORT: "9102"}

  cart-canary:
    <<: *service
    container_name: aidevops-cart-canary
    environment: {<<: *otel, OTEL_SERVICE_NAME: cart-canary, SVC: cart-canary, SRC: cart, PORT: "9103"}

  payments-canary:
    <<: *service
    container_name: aidevops-payments-canary
    environment: {<<: *otel, OTEL_SERVICE_NAME: payments-canary, SVC: payments-canary, SRC: payments, PORT: "9104"}

  orders-canary:
    <<: *service
    container_name: aidevops-orders-canary
    environment: {<<: *otel, OTEL_SERVICE_NAME: orders-canary, SVC: orders-canary, SRC: orders, PORT: "9105"}

  # Reads container CPU and memory from the engine's stats API. The ONLY container with the engine
  # socket, and it serves one read-only endpoint (/stats). On Podman set CONTAINER_SOCK (see README).
  metrics:
    <<: *service
    container_name: aidevops-metrics
    volumes:
      - ${CONTAINER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    command: ["uvicorn", "main:app", "--app-dir", "/metrics", "--host", "0.0.0.0", "--port", "9200"]

  ops:
    <<: *service
    container_name: aidevops-ops
    ports: ["9000:9000"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: ops
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://127.0.0.1:9000/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://127.0.0.1:9000/v1/metrics
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://127.0.0.1:9000/v1/logs
      # Do not trace the dashboard's own polling or the receivers themselves (that would feed back into itself).
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "v1/traces,v1/metrics,v1/logs,api/state,api/traces,api/telemetry,api/metrics,api/logs,api/health,m/api,/$"
    env_file: ../.env
    command: ["uvicorn", "main:app", "--app-dir", "/ops", "--host", "0.0.0.0", "--port", "9000"]
    depends_on: [gateway, catalog, inventory, cart, payments, orders, metrics]

volumes:
  runtime:
