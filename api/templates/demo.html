<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewMind Live Demo</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d2129; --line:#2a2f3a;
    --fg:#e6e9ef; --muted:#9aa3b2; --accent:#5b9dff; --good:#3ddc97;
    --warn:#ffb454; --bad:#ff6b6b; --dim:#6b7384;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dfe3ea;
      --fg:#13161b; --muted:#5a6473; --dim:#8b93a1;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 16px 72px}
  header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
  h1{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px}
  .nav a{margin-right:16px;font-weight:600;text-decoration:none;color:var(--accent)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  h3{font-size:13px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;
     letter-spacing:.06em;font-weight:600}
  textarea{width:100%;min-height:230px;background:var(--panel2);color:var(--fg);
    border:1px solid var(--line);border-radius:8px;padding:12px;
    font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
  button{background:var(--accent);color:#06101f;border:0;border-radius:8px;
    padding:10px 18px;font-weight:650;font-size:14px;cursor:pointer}
  button:disabled{opacity:.55;cursor:not-allowed}
  button.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    font-weight:500;padding:6px 11px;font-size:13px;margin:0 6px 6px 0}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
  .issue{border-left:3px solid var(--warn);background:var(--panel2);
    padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:10px}
  .issue.critical,.issue.high{border-left-color:var(--bad)}
  .issue.low,.issue.info{border-left-color:var(--dim)}
  .issue .loc{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
  .sev{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;
    padding:1px 7px;border-radius:4px;background:var(--bad);color:#fff;margin-right:6px}
  .sev.medium{background:var(--warn);color:#2a1a00}
  .sev.low,.sev.info{background:var(--dim)}
  .ctx{font:12px ui-monospace,Menlo,monospace;background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:7px}
  .tag{font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);margin-left:6px}
  .tag.callee{border-color:var(--good);color:var(--good)}
  .tag.caller{border-color:var(--accent);color:var(--accent)}
  .meta{font-size:12.5px;color:var(--muted);margin-top:10px;
        font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-style:italic;font-size:14px}
  pre{margin:6px 0 0;white-space:pre-wrap;font:12px ui-monospace,Menlo,monospace;
      background:var(--panel2);padding:9px 11px;border-radius:6px;overflow-x:auto}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  label{font-size:14px;display:flex;align-items:center;gap:7px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>ReviewMind — Live Review</h1>
  <div class="sub">Paste a code change. ReviewMind retrieves related code from the
    repository, then reviews it.</div>
  <div class="nav" style="margin-top:12px"><a href="/">← Results dashboard</a></div>
</header>

<div class="card" style="margin-bottom:16px">
  <h3>Example changes</h3>
  <div id="examples"></div>
  <div class="sub" style="margin-top:6px" id="exdesc"></div>
</div>

<div class="cols">
  <div class="card">
    <h3>The change under review</h3>
    <textarea id="diff" spellcheck="false"
      placeholder="Paste a unified diff here, or pick an example above..."></textarea>
    <div class="row">
      <button id="go">Review</button>
      <label><input type="checkbox" id="retr" checked> Use retrieval</label>
      <label><input type="checkbox" id="cmp"> Compare both</label>
    </div>
    <div class="meta" id="status"></div>
  </div>

  <div class="card">
    <h3>Result</h3>
    <div id="out"><div class="empty">No review yet.</div></div>
  </div>
</div>

<div class="card" style="margin-top:16px">
  <h3>Retrieved context — what the reviewer was shown beyond the diff</h3>
  <div id="ctx"><div class="empty">Nothing retrieved yet.</div></div>
</div>

<script>
const CASES = {{ cases|tojson }};
const $ = id => document.getElementById(id);

const ex = $('examples');
CASES.forEach((c,i) => {
  const b = document.createElement('button');
  b.className = 'ghost';
  b.textContent = c.title || c.case_id;
  b.onclick = () => {
    $('diff').value = c.diff;
    $('exdesc').textContent = c.description;
  };
  ex.appendChild(b);
});

function sevClass(s){ return ['critical','high','medium','low','info'].includes(s)?s:'medium'; }

function renderIssues(data, label){
  const parts = [];
  if (label) parts.push(`<div style="font-weight:650;margin:4px 0 8px">${label}</div>`);
  const issues = data.issues || [];
  if (!issues.length) parts.push('<div class="empty">No defects reported.</div>');
  issues.forEach(i => {
    const sc = sevClass(i.severity);
    parts.push(`<div class="issue ${sc}">
      <span class="sev ${sc}">${(i.severity||'').toUpperCase()}</span>
      <span class="loc">${i.file||''}:${i.line??'?'}</span>
      <div>${(i.message||'').replace(/</g,'&lt;')}</div>
      ${i.suggestion?`<div class="sub" style="margin-top:5px">→ ${i.suggestion.replace(/</g,'&lt;')}</div>`:''}
    </div>`);
  });
  (data.test_suggestions||[]).forEach(t => {
    parts.push(`<div class="issue low"><b>Suggested test:</b> <code>${t.name||''}</code>
      <div class="sub">${(t.rationale||'').replace(/</g,'&lt;')}</div>
      ${t.code?`<pre>${t.code.replace(/</g,'&lt;')}</pre>`:''}</div>`);
  });
  parts.push(`<div class="meta">${data.wall_s??data.latency_s}s ·
    ${data.prompt_tokens||0}+${data.completion_tokens||0} tokens ·
    retrieval: ${data.retriever||'none'}</div>`);
  return parts.join('');
}

function renderCtx(ctx){
  if(!ctx || !ctx.length) return '<div class="empty">No context retrieved (diff-only mode).</div>';
  return ctx.map(c => `<div class="ctx">
      <b>${c.file}:${c.start_line}-${c.end_line}</b> ${c.name}
      <span class="tag ${c.direction}">${c.direction}</span>
    </div>`).join('');
}

async function review(useRetrieval){
  const r = await fetch('/api/review', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({diff: $('diff').value, use_retrieval: useRetrieval})
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

$('go').onclick = async () => {
  const diff = $('diff').value.trim();
  if(!diff){ $('status').textContent = 'Paste a diff first.'; return; }
  $('go').disabled = true;
  $('status').innerHTML = '<span class="spin"></span> reviewing…';
  $('out').innerHTML = ''; $('ctx').innerHTML = '';
  try{
    if($('cmp').checked){
      // The central comparison: same change, with and without retrieval.
      const [no, yes] = await Promise.all([review(false), review(true)]);
      $('out').innerHTML =
        renderIssues(no,  'WITHOUT retrieval (diff only)') +
        '<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">' +
        renderIssues(yes, 'WITH retrieval (ReviewMind)');
      $('ctx').innerHTML = renderCtx(yes.context);
    } else {
      const d = await review($('retr').checked);
      $('out').innerHTML = renderIssues(d);
      $('ctx').innerHTML = renderCtx(d.context);
    }
    $('status').textContent = '';
  }catch(e){
    $('status').textContent = 'Error: ' + e.message;
    $('out').innerHTML = '<div class="empty">Request failed.</div>';
  }finally{ $('go').disabled = false; }
};
</script>
</div>
</body>
</html>
